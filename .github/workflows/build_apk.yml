name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Repo holds only pubspec.yaml + lib/ + test/ — generate the Android
      # scaffolding here so local Flutter installs are never required.
      - name: Generate platform scaffolding
        run: |
          flutter create . \
            --project-name solaire_balance_display \
            --org com.solaire \
            --platforms android
          # flutter create adds the counter-app template test, which references
          # a MyApp class that does not exist in this app.
          rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: solaire-balance-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
